<section class="section">
  <div class="container">
    <div class="cta-banner">
      <div class="cta-banner__content">
        <span class="cta-banner__eyebrow">Pronto para começar?</span>
        <h2 class="cta-banner__title">Estruture seu clube de assinatura de café com o BeanByte ainda hoje</h2>
        <p class="cta-banner__subtitle">
          Solicite o acesso da sua marca e tenha ambiente dedicado para assinantes, planos, catálogo de cafés e ciclos mensais.
        </p>
      </div>

      <div class="cta-banner__actions">
        <button mat-flat-button color="primary" type="button" (click)="startRequested.emit()">
          Solicitar demonstração
          <mat-icon iconPositionEnd aria-hidden="true">arrow_forward</mat-icon>
        </button>
        <a mat-stroked-button href="#planos">Comparar planos</a>
      </div>
    </div>
  </div>
</section>
