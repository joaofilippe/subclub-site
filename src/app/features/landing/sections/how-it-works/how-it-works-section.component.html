<section id="como-funciona" class="section section--alt">
  <div class="container">
    <app-section-header
      eyebrow="Como funciona"
      title="Do catálogo ao primeiro ciclo recorrente em 3 passos"
      subtitle="Estruture seu clube sem complexidade técnica e mantenha foco no produto e na experiência do assinante."
    />

    <div class="steps-grid">
      @for (step of steps; track step.number) {
        <article class="step-card">
          <div class="step-card__header">
            <span class="step-card__number">{{ step.number }}</span>
            <span class="step-card__icon">
              <mat-icon aria-hidden="true">{{ step.icon }}</mat-icon>
            </span>
          </div>

          <h3 class="step-card__title">{{ step.title }}</h3>
          <p class="step-card__description">{{ step.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
