<section id="faq" class="section section--alt">
  <div class="container faq__container">
    <app-section-header
      eyebrow="Dúvidas frequentes"
      title="Perguntas comuns sobre o SubClub"
      subtitle="Entenda como a plataforma protege seus dados, organiza sua operação e acompanha o crescimento do seu clube."
    />

    <mat-accordion class="faq__accordion">
      @for (item of faqItems; track item.question) {
        <mat-expansion-panel class="faq__panel">
          <mat-expansion-panel-header>
            <mat-panel-title class="faq__question">{{ item.question }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p class="faq__answer">{{ item.answer }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</section>
